name: verify

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_python.py
      - run: python scripts/scan_public.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/bytedance/tomato/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
