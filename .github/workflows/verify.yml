name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax / import gate
        run: python scripts/check_python.py
      - name: Public-data secret scan
        run: python scripts/scan_public.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/bytedance/tomato/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/bytedance/tomato/rust
      - name: Test
        run: cargo test --locked
