name: build-rust

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: platforms/bytedance/tomato/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tomato-signer-${{ matrix.target }}
          path: |
            platforms/bytedance/tomato/rust/target/${{ matrix.target }}/release/tomato-signer*

  publish:
    # 只有推送 v* 标签时才发布 Release；手动触发与分支推送只产出 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f -printf '%p (%s bytes)\n'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Rust integration scaffold for the Tomato signer.

            These binaries are the integration boundary only — they do **not** contain a
            current online Medusa implementation. See `docs/RESEARCH_LOG.md` for the exact
            verification boundary.
