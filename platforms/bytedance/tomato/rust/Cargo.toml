[package]
name = "tomato-signer"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust verified Tomato primitives with an explicit current-Medusa capability boundary"
license = "MIT"

[features]
default = []
current-vm = []

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
md5 = "0.7"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
